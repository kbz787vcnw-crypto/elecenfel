<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="common.js"></script><link rel="stylesheet" href="style.css"><title>Sound Effects</title></head><body data-title="sfx_title">
<main class="wrap card">
<a class="back" href="/" data-i18n="menu_back"></a>
<h1>🔊 <span data-i18n="sfx_title"></span></h1>
<textarea id="text" rows="4" data-i18n-ph="sfx_ph"></textarea>
<input type="number" id="dur" min="0.5" max="30" step="0.5" data-i18n-ph="dur_ph">
<button id="go" data-i18n="go_sfx"></button>
<p id="st"></p><audio id="out" controls hidden></audio>
</main>
<script>
go.onclick = () => run(go, st, async () => {
  const r = await api("/sfx", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({text: text.value, duration_seconds: dur.value || null})});
  await showAudio(r, out);
});
</script></body></html>
